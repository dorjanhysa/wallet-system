<h2 mat-dialog-title>New Account</h2>

<mat-dialog-content>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Currency</mat-label>
    <mat-select [value]="currency()" (valueChange)="currency.set($event)">
      @for (c of currencies; track c) {
        <mat-option [value]="c">{{ c }}</mat-option>
      }
    </mat-select>
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button matButton (click)="cancel()">Cancel</button>
  <button matButton="filled" (click)="confirm()">Create</button>
</mat-dialog-actions>
