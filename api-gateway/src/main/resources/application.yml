server:
  port: 8000

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: http://${AUTH_HOST:localhost}:8080
              predicates:
                - Path=/api/auth/**, /oauth2/**
            - id: account-service
              uri: http://${ACCOUNT_HOST:localhost}:8081
              predicates:
                - Path=/api/accounts/**
            - id: transaction-service
              uri: http://${TRANSACTION_HOST:localhost}:8082
              predicates:
                - Path=/api/transfers/**
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:4200"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: true

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    org.springframework.cloud.gateway: INFO