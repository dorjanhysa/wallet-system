apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
data:
  init-db.sql: |
    CREATE DATABASE wallet_auth;
    CREATE DATABASE wallet_account;
    CREATE DATABASE wallet_transaction;
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
type: Opaque
stringData:
  POSTGRES_USER: wallet
  POSTGRES_PASSWORD: wallet